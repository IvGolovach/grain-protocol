name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  CI_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  scope:
    name: Scope CI
    runs-on: ubuntu-latest
    outputs:
      full_required: ${{ steps.scope.outputs.full_required }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Classify this exact event
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            python3 tools/ci/classify_ci_scope.py \
              --event-name "$EVENT_NAME" \
              --github-output "$GITHUB_OUTPUT"
          else
            files_json="$(mktemp)"
            trap 'rm -f "$files_json"' EXIT
            gh api --paginate --slurp \
              "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" > "$files_json"

            python3 tools/ci/classify_ci_scope.py \
              --event-name "$EVENT_NAME" \
              --expected-count "$PR_CHANGED_FILES" \
              --files-json "$files_json" \
              --github-output "$GITHUB_OUTPUT"
          fi

  full-ci-approval:
    name: Approve full CI
    needs: [scope, python-tooling, capid-csprng-audit, rust-core, ts-c01, ts-full, wasm-smoke]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.full_required == 'true' &&
      needs.python-tooling.result == 'success' &&
      needs.capid-csprng-audit.result == 'success' &&
      needs.rust-core.result == 'success' &&
      needs.ts-c01.result == 'success' &&
      needs.ts-full.result == 'success' &&
      needs.wasm-smoke.result == 'success'
    permissions: {}
    environment:
      name: full-ci
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Record approval for this workflow run
        run: echo "Full CI approved for ${CI_COMMIT_SHA}."

  python-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/python-policy-checks
        with:
          run_main_ruleset_drift: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          ruleset_token: ${{ github.token }}

      - name: Run Python guard tests
        run: |
          python3 -m unittest tools.ci.test_audit_invariants
          python3 -m unittest tools.ci.test_check_food_profile
          python3 -m unittest tools.ci.test_check_repo_native_developer_platform
          python3 -m unittest tools.ci.test_check_npm_release_dry_run
          python3 -m unittest tools.ci.test_check_sdk_release_package
          python3 -m unittest tools.ci.test_check_external_sdk_handoff
          python3 -m unittest tools.ci.test_check_release_evidence_assets
          python3 -m unittest tools.ci.test_check_external_consumer_templates
          python3 -m unittest tools.ci.test_check_external_release_consumer_smoke
          python3 -m unittest tools.ci.test_check_public_sdk_api
          python3 -m unittest tools.ci.test_check_device_adapter_contract
          python3 -m unittest tools.ci.test_check_sdk_compatibility_matrix
          python3 -m unittest tools.ci.test_check_registry_dry_run_metadata
          python3 -m unittest tools.ci.test_check_external_client_certification
          python3 -m unittest tools.ci.test_check_local_scanner_flow_report
          python3 -m unittest tools.ci.test_check_local_food_pilot_report
          python3 -m unittest tools.ci.test_check_no_secret_telemetry
          python3 -m unittest tools.ci.test_check_trust_bundle_governance
          python3 -m unittest tools.ci.test_check_release_train_docs
          python3 -m unittest tools.ci.test_check_workflow_action_pinning
          python3 -m unittest tools.ci.test_check_dependabot_policy
          python3 -m unittest tools.ci.test_check_ci_economy_policy
          python3 -m unittest tools.ci.test_check_full_ci_environment
          python3 -m unittest tools.ci.test_classify_ci_scope
          python3 -m unittest tools.ci.test_evaluate_ci_gate
          python3 -m unittest tools.ci.test_check_golden_images_policy

  capid-csprng-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: cap_id CSPRNG static audit
        run: python3 tools/ci/check_capid_csprng.py

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/rust-core-verification
        with:
          commit_sha: ${{ env.CI_COMMIT_SHA }}

      - name: Upload rust suite summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-suite-summary
          path: artifacts/rust-suite-summary.json
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  ts-c01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-node-typescript

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: runner/typescript
          script: run:c01

      - name: Run Rust vs TS divergence (C01)
        run: npm --prefix runner/typescript run divergence:c01

      - name: Collect TS artifacts
        run: |
          mkdir -p artifacts
          cp runner/typescript/.c01-last-run.json artifacts/ts-c01-summary.json
          cp runner/typescript/.divergence-c01.json artifacts/divergence-c01.json
          cp runner/typescript/.divergence-c01.md artifacts/divergence-c01.md

      - name: Upload TS C01 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ts-c01-results
          path: artifacts/*
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  ts-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-rust-toolchain

      - uses: ./.github/actions/setup-node-typescript

      - name: Build grain-runner binary (RC stabilization smoke)
        run: cargo build --manifest-path core/rust/Cargo.toml -p grain-runner

      - name: Run RC stabilization smoke (TOR-RC-STAB-A01)
        run: |
          python3 tools/stabilization/run_rc_stab.py \
            --mode smoke \
            --out-dir artifacts/rc-stab-smoke \
            --baseline-tag repo-rc-v0.4.0-rc1 \
            --baseline-evidence-sha 35475fd1767ec873a4bfa46c51ffffd23843831e21df5c17db0e5d2162b3a1bd \
            --rust-runner-cmd core/rust/target/debug/grain-runner \
            --repo "${GITHUB_REPOSITORY}"

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: runner/typescript
          script: run:full

      - name: TS strict conformance suite (runner contract, full)
        run: |
          python3 tools/ci/run_runner_suite.py \
            --vectors-root conformance/vectors \
            --commit-sha "${CI_COMMIT_SHA}" \
            --out artifacts/suite-run-ts.json \
            --runner-cmd node runner/typescript/dist/src/cli.js run --strict --vector

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: core/ts/grain-sdk
          script: run:protocol-suite

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: core/ts/grain-sdk
          script: test:invariants

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: core/ts/grain-sdk-ai
          script: test:boundary

      - name: Run Rust vs TS divergence (full suite)
        run: GRAIN_RUST_RUNNER_BIN=core/rust/target/debug/grain-runner npm --prefix runner/typescript run divergence:full

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: runner/typescript
          script: test:cborseq-contract

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: runner/typescript
          script: test:base64-contract

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: runner/typescript
          script: test:e2e-contract

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: runner/typescript
          script: test:properties

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: runner/typescript
          script: test:integer-precision

      - name: Collect TS full artifacts
        run: |
          mkdir -p artifacts
          cp runner/typescript/.full-last-run.json artifacts/ts-full-summary.json
          cp runner/typescript/.divergence-full.json artifacts/divergence-full.json
          cp runner/typescript/.divergence-full.md artifacts/divergence-full.md
          cp runner/typescript/.properties-full.json artifacts/properties-full.json

      - name: Upload TS full artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ts-full-results
          path: artifacts/*
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-rust-toolchain

      - name: Add wasm target
        run: rustup target add wasm32-wasip1

      - uses: ./.github/actions/setup-node-typescript

      - name: Build grain-core-wasm
        run: cargo build --manifest-path core/rust/Cargo.toml -p grain-core-wasm --target wasm32-wasip1 --release

      - name: Check client workflow WASM package
        run: scripts/sdk/check_wasm_package.sh

      - uses: ./.github/actions/run-node-package-script
        with:
          prefix: runner/typescript
          script: run:wasm-subset

      - name: Collect WASM artifacts
        run: |
          mkdir -p artifacts
          cp runner/typescript/.wasm-subset-last-run.json artifacts/wasm-subset-summary.json
          sha256sum core/rust/target/wasm32-wasip1/release/grain_core_wasm.wasm | awk '{print $1}' > artifacts/wasm.sha256

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wasm-smoke-results
          path: artifacts/wasm*
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  sdk-platform:
    needs: [scope, full-ci-approval]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      (
        github.event_name != 'pull_request' ||
        (
          needs.scope.outputs.full_required == 'true' &&
          needs.full-ci-approval.result == 'success'
        )
      )
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-rust-toolchain

      - name: Add WASM target
        run: rustup target add wasm32-wasip1

      - name: Set up Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Install TypeScript SDK dependencies
        run: |
          npm ci --prefix core/ts/grain-ts-core
          npm ci --prefix core/ts/grain-sdk
          npm ci --prefix core/ts/grain-sdk-ai

      - name: Install WASM SDK package deps
        run: npm ci --prefix sdk/wasm

      - name: Install WASM scanner deps
        run: npm ci --prefix examples/wasm-scanner

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Swift version
        run: swift --version

      - name: Verify generated platform SDKs
        run: scripts/sdk/verify_all_sdks.sh --strict --out-dir artifacts/sdk-platform

      - name: Verify local scanner DevKit flow
        run: scripts/sdk/run_local_scanner_flow.sh --strict --out-dir artifacts/sdk-local-scanner-flow

      - name: Package client SDK release artifacts
        run: |
          scripts/sdk/package_client_sdks.sh \
            --skip-verify \
            --verified-by sdk-platform \
            --out-dir artifacts/sdk-release

      - name: Verify external developer handoff
        run: |
          expected_commit="$(git rev-parse HEAD)"
          python3 tools/ci/check_sdk_compatibility_matrix.py \
            --manifest artifacts/sdk-release/manifest.json
          python3 tools/ci/check_external_consumer_templates.py \
            --out-dir artifacts/sdk-release \
            --expected-commit "${expected_commit}"
          python3 tools/ci/check_external_release_consumer_smoke.py \
            --out-dir artifacts/sdk-release \
            --expected-commit "${expected_commit}" \
            --strict \
            --consumer-root artifacts/external-release-consumer-smoke
          scripts/sdk/check_registry_dry_runs.sh \
            --out-dir artifacts/sdk-registry-dry-runs

      - name: Upload platform SDK verification summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-platform-results
          path: artifacts/sdk-platform
          retention-days: 30

      - name: Upload client SDK release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-release-package
          path: artifacts/sdk-release/*
          retention-days: 30

      - name: Upload SDK registry dry-run results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-registry-dry-run-results
          path: artifacts/sdk-registry-dry-runs
          retention-days: 30

      - name: Upload external client certification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-client-certification
          path: artifacts/sdk-platform/external-client-certification
          retention-days: 30

  fuzz-smoke:
    needs: scope
    if: needs.scope.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.CI_COMMIT_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-rust-toolchain
      - uses: ./.github/actions/setup-node-typescript

      - name: Build grain-runner binary
        run: cargo build --manifest-path core/rust/Cargo.toml -p grain-runner

      - name: Run deterministic fuzz smoke corpus
        run: ./scripts/fuzz-smoke --out-dir artifacts/fuzz-smoke

      - name: Upload fuzz smoke artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-smoke-results
          path: artifacts/fuzz-smoke
          retention-days: 30

  verify-script-smoke:
    needs: scope
    if: needs.scope.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.CI_COMMIT_SHA }}
          persist-credentials: false

      - name: Build grain-certify container locally
        run: docker build -f docker/grain-certify.Dockerfile -t "grain-certify-ci:${CI_COMMIT_SHA}" .

      - name: Run one-command verify smoke
        run: ./scripts/verify --image "grain-certify-ci:${CI_COMMIT_SHA}" --out-dir artifacts/verify-smoke

      - name: Verify evidence hash exists
        run: test -f artifacts/verify-smoke/evidence/evidence_content.sha256

  evidence-bundle:
    if: >-
      always() &&
      needs.python-tooling.result == 'success' &&
      needs.capid-csprng-audit.result == 'success' &&
      needs.rust-core.result == 'success' &&
      needs.ts-c01.result == 'success' &&
      needs.ts-full.result == 'success' &&
      needs.wasm-smoke.result == 'success' &&
      needs.sdk-platform.result == 'success'
    runs-on: ubuntu-latest
    needs: [scope, python-tooling, capid-csprng-audit, rust-core, ts-c01, ts-full, wasm-smoke, sdk-platform]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Download upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name rust-suite-summary --dir artifacts
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name ts-c01-results --dir artifacts
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name ts-full-results --dir artifacts
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name wasm-smoke-results --dir artifacts
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name sdk-platform-results --dir artifacts
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name sdk-release-package --dir artifacts/sdk-release

      - name: Verify SDK release package metadata
        run: |
          expected_commit="$(git rev-parse HEAD)"
          python3 tools/ci/check_sdk_release_package.py \
            --out-dir artifacts/sdk-release \
            --expected-commit "${expected_commit}" \
            --require-strict \
            --require-clean
          python3 tools/ci/check_external_release_consumer_smoke.py \
            --out-dir artifacts/sdk-release \
            --expected-commit "${expected_commit}" \
            --layout-only \
            --consumer-root artifacts/external-release-consumer-smoke

      - uses: ./.github/actions/build-evidence-bundle
        with:
          commit_sha: ${{ env.CI_COMMIT_SHA }}
          workflow_name: ci
          include_sdk_suite: "true"
          hash_order: full-first

      - name: Upload evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ env.CI_COMMIT_SHA }}
          path: artifacts/evidence-${{ env.CI_COMMIT_SHA }}.zip
          retention-days: 30

  ci-gate:
    name: CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - scope
      - full-ci-approval
      - python-tooling
      - capid-csprng-audit
      - rust-core
      - ts-c01
      - ts-full
      - wasm-smoke
      - sdk-platform
      - fuzz-smoke
      - verify-script-smoke
      - evidence-bundle
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Evaluate the fail-closed CI contract
        env:
          FULL_REQUIRED: ${{ needs.scope.outputs.full_required }}
        run: |
          python3 tools/ci/evaluate_ci_gate.py \
            --event-name "${{ github.event_name }}" \
            --full-required "${FULL_REQUIRED}" \
            --job "scope=${{ needs.scope.result }}" \
            --job "full-ci-approval=${{ needs.full-ci-approval.result }}" \
            --job "python-tooling=${{ needs.python-tooling.result }}" \
            --job "capid-csprng-audit=${{ needs.capid-csprng-audit.result }}" \
            --job "rust-core=${{ needs.rust-core.result }}" \
            --job "ts-c01=${{ needs.ts-c01.result }}" \
            --job "ts-full=${{ needs.ts-full.result }}" \
            --job "wasm-smoke=${{ needs.wasm-smoke.result }}" \
            --job "sdk-platform=${{ needs.sdk-platform.result }}" \
            --job "fuzz-smoke=${{ needs.fuzz-smoke.result }}" \
            --job "verify-script-smoke=${{ needs.verify-script-smoke.result }}" \
            --job "evidence-bundle=${{ needs.evidence-bundle.result }}"
